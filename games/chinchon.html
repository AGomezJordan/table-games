<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Chinchón</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="./chinchon/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
</head>
<body>
  <div id="action-container">
    <button
      class="button"
      onclick="newGame()"
    >
      Nueva partida
    </button>
    <h1 style="text-align: center;">CHINCHÓN</h1>
    <button class="button" onclick="endRound()">Fin de ronda</button>
  </div>
  <div class="final-score-container">Hasta: <span id="label-final-score">100</span></div>
  <div id="game-container"></div>
  <div class="popup popup--closed" id="popupBackGround">
    <div class="popup-container">
      <button
        class="close-popup"
        onclick="onClosePopUp('popupBackGround')"
      >
        X
      </button>
      <div class="popup-data popup-data--game">
        <div class="row">
          <div class="label">Jugadores:</div>
          <div class="label-data" id="player-count">0</div>
        </div>
        <div class="players" id="player-lists"></div>
        <div class="form form--new-game">
          <div style="text-align: center;">
            <div class="label">Nombre</div>
            <input type="text" id="player-name" />
          </div>
          <div style="text-align: center;">
            <div class="label">Puntuación</div>
            <button
              id="button_score--50"
              class="button"
              onclick="setFinalScore(50)">
              50
            </button>
            <button
              id="button_score--100"
              class="button button--selected"
              onclick="setFinalScore(100)">
              100
            </button>
            <button
              id="button_score--150"
              class="button"
              onclick="setFinalScore(150)">
              150
            </button>
            <button
              id="button_score--200"
              class="button"
              onclick="setFinalScore(200)">
              200
            </button>
          </div>
        </div>
        <div class="form-footer">
          <button class="button button--active" onclick="saveNewPlayer()">Añadir</button>
          <button class="button" onclick="startGame()">Empezar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="popup popup--closed" id="popupFinRonda">
    <div class="popup-container">
      <button
        class="close-popup"
        onclick="onClosePopUp('popupFinRonda')"
      >
        X
      </button>
      <div class="popup-data popup-data--round">
        <div class="row">
          <div class="label">FIN RONDA</div>
        </div>
        <div class="form form-round">
          <div class="player-card">
            <div class="player-card--name" id="round-name"></div>
            <div class="player-card--score" id="round-score"></div>
          </div>
          <div id="error-message">La puntuación mas alta supera el 90% de la puntuación final.</div>
          <div class="round-action">
            <button id="button-less-10" class="button" onclick="setSum(-10)">-10</button>
            <button id="button-equal-cero" class="button" onclick="setSum('reset')">= 0</button>
            <button id="button-restart-player" class="button" onclick="restartPlayer()">Reengancharse</button>
            <input
              id="input-suma"
              type="number"
              oninput="setSum(this.value)"
              onclick="this.value = this.value == 0 ? '' : this.value"
            />
          </div>
        </div>
        <div class="form-footer">
          <button class="button" onclick="onClosePopUp('popupFinRonda')">Cancelar</button>
          <button class="button button--active" onclick="nextPlayer()">Siguiente</button>
        </div>
      </div>
    </div>
  </div>
  <script src="./chinchon/javascript.js"></script>
</body>
</html>
